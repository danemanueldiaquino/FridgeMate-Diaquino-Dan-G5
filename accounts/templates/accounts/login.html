<!DOCTYPE html>
<html>
<head>
    <title>FridgeMate - Login</title>
</head>
<body>

    <h1>Login to FridgeMate</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>

</body>
</html>
