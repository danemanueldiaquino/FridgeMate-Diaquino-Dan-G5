<!DOCTYPE html>
<html>
<head>
    <title>FridgeMate - Register</title>
</head>
<body>

    <h1>Create Your FridgeMate Account</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </p>

</body>
</html>
